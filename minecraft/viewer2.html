<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Markdown Viewer</title>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Pixelify Sans', sans-serif;
            background: #0f0f0f;
            color: white;
            text-align: left;
        }

        h1 {
            margin-top: 20vh;
            font-size: 120px;
        }

        .subtitle {
            font-size: 18px;
            margin-top: -20px;
            margin-bottom: 40px;
            color: #cccccc;
        }

        .buttons {
            margin-top: 40px;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            border: 2px solid white;
            color: white;
            text-decoration: none;
            font-size: 24px;
        }

        .btn:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>
    <div id="content">Loading...</div>

    <script>
        fetch("/minecraft/guide2.md")
            .then(res => res.text())
            .then(md => {
                document.getElementById("content").innerHTML = marked.parse(md);
            });
    </script>
</body>
</html>
